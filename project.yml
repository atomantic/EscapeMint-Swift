name: EscapeMint
options:
  bundleIdPrefix: net.shadowpuppet
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: TYQ32QCF6K
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: 26
    SWIFT_VERSION: "6.0"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  EscapeMint:
    type: application
    platform: [iOS, macOS]
    sources:
      - EscapeMint
    resources:
      - path: EscapeMint/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.EscapeMint
        DEVELOPMENT_TEAM: TYQ32QCF6K
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: EscapeMint
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    info:
      path: EscapeMint/App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: EscapeMint
        LSApplicationCategoryType: public.app-category.finance
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: EscapeMint/App/EscapeMint.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.net.shadowpuppet.EscapeMint
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.security.application-groups:
          - group.net.shadowpuppet.EscapeMint
    dependencies:
      - target: EscapeMintWidget_iOS
        embed: true
        codeSign: true
        platforms: [iOS]

  EscapeMintWidget:
    type: app-extension
    platform: [iOS]
    sources:
      - EscapeMintWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.EscapeMint.widget
        DEVELOPMENT_TEAM: TYQ32QCF6K
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: EscapeMintWidget/Info.plist
    entitlements:
      path: EscapeMintWidget/EscapeMintWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.shadowpuppet.EscapeMint

  EscapeMintTests_iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - EscapeMintTests
    dependencies:
      - target: EscapeMint_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.EscapeMint.tests

  EscapeMintTests_macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - EscapeMintTests
    dependencies:
      - target: EscapeMint_macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.EscapeMint.tests
