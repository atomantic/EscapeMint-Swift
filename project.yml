name: EscapeMint
options:
  bundleIdPrefix: net.shadowpuppet
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: TYQ32QCF6K
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    SUPPORTS_MACCATALYST: false

targets:
  EscapeMint:
    type: application
    platform: [iOS, macOS]
    sources:
      - EscapeMint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.EscapeMint
        INFOPLIST_FILE: EscapeMint/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    entitlements:
      path: EscapeMint/App/EscapeMint.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true

  EscapeMintTests_iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - EscapeMintTests
    dependencies:
      - target: EscapeMint_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.EscapeMint.tests

  EscapeMintTests_macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - EscapeMintTests
    dependencies:
      - target: EscapeMint_macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.EscapeMint.tests
