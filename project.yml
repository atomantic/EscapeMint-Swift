name: EscapeMint
options:
  bundleIdPrefix: net.shadowpuppet
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: TYQ32QCF6K  # forks: override via a gitignored xcconfig or env; CI uses secrets.TEAM_ID
    MARKETING_VERSION: "1.2.15"
    CURRENT_PROJECT_VERSION: 74
    SWIFT_VERSION: "6.0"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  EscapeMint:
    type: application
    platform: [iOS, macOS]
    sources:
      - EscapeMint
      - Shared
    resources:
      - path: EscapeMint/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.EscapeMint
        DEVELOPMENT_TEAM: TYQ32QCF6K
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Custom Info.plist keys (display name, category, encryption flag,
        # orientations) live in the `info.properties` block below — the single
        # source of truth for the generated Info.plist. Do NOT duplicate them
        # here as INFOPLIST_KEY_* build settings (gotcha catalogue #7): Xcode
        # ignores INFOPLIST_KEY_* whenever INFOPLIST_FILE is set, so keeping
        # both invites drift (e.g. mismatched iPhone orientation lists).
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": EscapeMint/App/EscapeMint.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": EscapeMint/App/EscapeMint.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": EscapeMint/App/EscapeMint-macOS.entitlements
    info:
      path: EscapeMint/App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: EscapeMint
        LSApplicationCategoryType: public.app-category.finance
        NSFaceIDUsageDescription: EscapeMint uses Face ID to protect your portfolio data.
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: EscapeMintWidget_iOS
        embed: true
        codeSign: true
        platforms: [iOS]

  EscapeMintWidget:
    type: app-extension
    platform: [iOS]
    sources:
      - EscapeMintWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.EscapeMint.widget
        DEVELOPMENT_TEAM: TYQ32QCF6K
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: EscapeMintWidget/Info.plist
    entitlements:
      path: EscapeMintWidget/EscapeMintWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.shadowpuppet.EscapeMint

  EscapeMintTests_iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - EscapeMintTests
    dependencies:
      - target: EscapeMint_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.EscapeMint.tests
        GENERATE_INFOPLIST_FILE: YES

  EscapeMintTests_macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - EscapeMintTests
    dependencies:
      - target: EscapeMint_macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.EscapeMint.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  EscapeMint_iOS:
    build:
      targets:
        EscapeMint_iOS: all
    test:
      targets:
        - EscapeMintTests_iOS
  EscapeMint_macOS:
    build:
      targets:
        EscapeMint_macOS: all
    test:
      targets:
        - EscapeMintTests_macOS
