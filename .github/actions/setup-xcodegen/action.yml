name: Setup XcodeGen
description: Install the repository-pinned XcodeGen release after verifying its checksum

runs:
  using: composite
  steps:
    - name: Download and verify XcodeGen
      shell: bash
      env:
        XCODEGEN_VERSION: "2.46.0"
        XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
      run: |
        set -euo pipefail

        install_dir="$(mktemp -d "${RUNNER_TEMP}/xcodegen.XXXXXX")"
        archive="${install_dir}/xcodegen.zip"
        url="https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"

        curl --fail --location --retry 3 --output "$archive" "$url"
        printf '%s  %s\n' "$XCODEGEN_SHA256" "$archive" | shasum -a 256 --check
        unzip -q "$archive" -d "$install_dir"

        echo "${install_dir}/xcodegen/bin" >> "$GITHUB_PATH"
        "${install_dir}/xcodegen/bin/xcodegen" --version
