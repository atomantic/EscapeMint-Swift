name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    name: Build & Test

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: 'latest-stable'

      - name: Install dependencies
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run iOS tests
        run: |
          # pipefail so a failing xcodebuild is not masked by xcbeautify's exit 0.
          set -o pipefail
          if xcrun simctl list devices available | grep -q "iPhone 16"; then
            DESTINATION="platform=iOS Simulator,name=iPhone 16"
          elif xcrun simctl list devices available | grep -q "iPhone 15"; then
            DESTINATION="platform=iOS Simulator,name=iPhone 15"
          else
            DESTINATION="platform=iOS Simulator,name=iPhone 14"
          fi

          xcodebuild test \
            -project EscapeMint.xcodeproj \
            -scheme EscapeMint_iOS \
            -only-testing:EscapeMintTests_iOS \
            -destination "$DESTINATION" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            | xcbeautify

      - name: Run macOS tests
        run: |
          # macOS is a shipping platform; build + test it so macOS-only
          # regressions are caught in CI rather than at deploy time.
          set -o pipefail
          xcodebuild test \
            -project EscapeMint.xcodeproj \
            -scheme EscapeMint_macOS \
            -only-testing:EscapeMintTests_macOS \
            -destination 'platform=macOS' \
            -configuration Debug \
            -derivedDataPath build-macos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            | xcbeautify
