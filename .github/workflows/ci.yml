name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    name: Build & Test

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: 'latest-stable'

      - name: Install dependencies
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run iOS tests
        run: |
          # pipefail so a failing xcodebuild is not masked by xcbeautify's exit 0.
          set -o pipefail
          DEVICE_ID=""
          while IFS= read -r device; do
            if [[ "$device" =~ iPhone.*\(([0-9A-Fa-f-]{36})\).*\((Booted|Shutdown)\) ]]; then
              DEVICE_ID="${BASH_REMATCH[1]}"
              break
            fi
          done < <(xcrun simctl list devices available)

          if [[ -z "$DEVICE_ID" ]]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi

          DESTINATION="platform=iOS Simulator,id=$DEVICE_ID"

          xcodebuild test \
            -project EscapeMint.xcodeproj \
            -scheme EscapeMint_iOS \
            -only-testing:EscapeMintTests_iOS \
            -destination "$DESTINATION" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            | xcbeautify

      - name: Run macOS tests
        run: |
          # macOS is a shipping platform; build + test it so macOS-only
          # regressions are caught in CI rather than at deploy time.
          set -o pipefail
          xcodebuild test \
            -project EscapeMint.xcodeproj \
            -scheme EscapeMint_macOS \
            -only-testing:EscapeMintTests_macOS \
            -destination 'platform=macOS' \
            -configuration Debug \
            -derivedDataPath build-macos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            | xcbeautify
