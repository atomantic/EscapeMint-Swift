name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    name: Build & Test

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.3'

      - name: Install pinned XcodeGen
        uses: ./.github/actions/setup-xcodegen

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run iOS tests
        run: |
          # pipefail so a failing xcodebuild is not masked by xcbeautify's exit 0.
          set -o pipefail
          AVAILABLE_DEVICES=$(xcrun simctl list devices available | sed -nE 's/^[[:space:]]+(iPhone.*) \([0-9A-F-]{36}\) \(.*/\1/p')
          for DEVICE in "iPhone 17 Pro" "iPhone 17" "iPhone 16" "iPhone 15" "iPhone 14"; do
            if printf '%s\n' "$AVAILABLE_DEVICES" | grep -Fxq "$DEVICE"; then
              DESTINATION="platform=iOS Simulator,name=$DEVICE"
              break
            fi
          done
          if [ -z "${DESTINATION:-}" ]; then
            echo "No supported iPhone simulator is available" >&2
            printf '%s\n' "$AVAILABLE_DEVICES" >&2
            exit 1
          fi

          xcodebuild test \
            -project EscapeMint.xcodeproj \
            -scheme EscapeMint_iOS \
            -only-testing:EscapeMintTests_iOS \
            -destination "$DESTINATION" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            | xcbeautify

      - name: Run macOS tests
        run: |
          # macOS is a shipping platform; build + test it so macOS-only
          # regressions are caught in CI rather than at deploy time.
          set -o pipefail
          xcodebuild test \
            -project EscapeMint.xcodeproj \
            -scheme EscapeMint_macOS \
            -only-testing:EscapeMintTests_macOS \
            -destination 'platform=macOS' \
            -configuration Debug \
            -derivedDataPath build-macos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            | xcbeautify
