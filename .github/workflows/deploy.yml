name: Deploy

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    name: Build & Upload to TestFlight (iOS + macOS + watchOS)
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install dependencies
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Write App Store Connect API key
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          mkdir -p "$HOME/.private_keys"
          KEY_PATH="$HOME/.private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          printf '%s' "$APPSTORE_API_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPSTORE_API_PRIVATE_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Write .env for deploy.sh
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          cat > .env <<EOF
          TEAM_ID=$TEAM_ID
          APPSTORE_API_KEY_ID=$APPSTORE_API_KEY_ID
          APPSTORE_ISSUER_ID=$APPSTORE_ISSUER_ID
          APPSTORE_API_PRIVATE_KEY_PATH=$APPSTORE_API_PRIVATE_KEY_PATH
          EOF

      - name: Deploy to TestFlight
        run: ./deploy.sh --skip-tests --no-bump
