name: Deploy

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-26
    name: Build & Upload to TestFlight (iOS + macOS + watchOS)
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.3'

      - name: Install pinned XcodeGen
        uses: ./.github/actions/setup-xcodegen

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Write App Store Connect API key
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          mkdir -p "$HOME/.private_keys"
          KEY_PATH="$HOME/.private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          printf '%s' "$APPSTORE_API_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPSTORE_API_PRIVATE_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Write .env for deploy.sh
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          cat > .env <<EOF
          TEAM_ID=$TEAM_ID
          APPSTORE_API_KEY_ID=$APPSTORE_API_KEY_ID
          APPSTORE_ISSUER_ID=$APPSTORE_ISSUER_ID
          APPSTORE_API_PRIVATE_KEY_PATH=$APPSTORE_API_PRIVATE_KEY_PATH
          EOF

      - name: Deploy to TestFlight
        # --skip-tests is a deliberate trade-off: the CI workflow (ci.yml) now
        # runs the iOS and macOS test suites on every push/PR, so tests have
        # already passed on this commit before a release tag is cut.
        run: ./deploy.sh --skip-tests --no-bump
